<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Ajay Weds Revathi AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets>
    <!-- Replace with your hosted MP4 video -->
    <video
      id="weddingVideo"
      src="wedding-video.mp4"
      preload="auto"
      loop
      autoplay
      muted
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- targetIndex: 0 means first registered image -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Video plane appears over photo -->
    <a-video
      src="#weddingVideo"
      width="1"
      height="1.77"
      position="0 0 0">
    </a-video>

  </a-entity>

</a-scene>

</body>
</html>
